<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-label="AuraCanvas banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#101a33"/>
      <stop offset="1" stop-color="#1a1440"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5eb0ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5eb0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b7bff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8b7bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbA" cx="0.38" cy="0.34" r="0.8">
      <stop offset="0" stop-color="#7cc0ff"/>
      <stop offset="0.45" stop-color="#0a84ff"/>
      <stop offset="1" stop-color="#063a7a"/>
    </radialGradient>
    <radialGradient id="orbB" cx="0.38" cy="0.34" r="0.8">
      <stop offset="0" stop-color="#c4b8ff"/>
      <stop offset="0.45" stop-color="#5e5ce6"/>
      <stop offset="1" stop-color="#26235e"/>
    </radialGradient>
    <radialGradient id="orbC" cx="0.38" cy="0.34" r="0.8">
      <stop offset="0" stop-color="#9fe8b4"/>
      <stop offset="0.45" stop-color="#1d8127"/>
      <stop offset="1" stop-color="#0c3a12"/>
    </radialGradient>
    <radialGradient id="orbD" cx="0.38" cy="0.34" r="0.8">
      <stop offset="0" stop-color="#ffcf8a"/>
      <stop offset="0.45" stop-color="#b56a00"/>
      <stop offset="1" stop-color="#4d2d00"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="600" fill="url(#bg)"/>
  <ellipse cx="330" cy="300" rx="330" ry="250" fill="url(#glowBlue)"/>
  <ellipse cx="250" cy="180" rx="260" ry="200" fill="url(#glowViolet)"/>

  <!-- constellation left -->
  <g stroke="#3d6db5" stroke-width="2" opacity="0.65">
    <line x1="300" y1="270" x2="470" y2="180"/>
    <line x1="300" y1="270" x2="440" y2="380"/>
    <line x1="470" y1="180" x2="620" y2="300"/>
    <line x1="440" y1="380" x2="620" y2="300"/>
    <line x1="300" y1="270" x2="180" y2="400"/>
  </g>
  <g>
    <circle cx="300" cy="270" r="86" fill="url(#orbA)"/>
    <circle cx="300" cy="270" r="104" fill="none" stroke="#0a84ff" stroke-width="3" opacity="0.7"/>
    <circle cx="470" cy="180" r="52" fill="url(#orbB)"/>
    <circle cx="470" cy="180" r="64" fill="none" stroke="#5e5ce6" stroke-width="2.5" opacity="0.7"/>
    <circle cx="440" cy="380" r="46" fill="url(#orbC)"/>
    <circle cx="620" cy="300" r="58" fill="url(#orbD)"/>
    <circle cx="620" cy="300" r="72" fill="none" stroke="#b56a00" stroke-width="2.5" opacity="0.6"/>
    <circle cx="180" cy="400" r="30" fill="url(#orbB)"/>
    <ellipse cx="278" cy="244" rx="20" ry="12" fill="#ffffff" opacity="0.35"/>
    <ellipse cx="455" cy="162" rx="12" ry="7" fill="#ffffff" opacity="0.35"/>
  </g>

  <!-- wordmark right -->
  <g font-family="Inter, system-ui, -apple-system, sans-serif">
    <text x="760" y="252" font-size="118" font-weight="800" fill="#ffffff" letter-spacing="-2">Aura<tspan fill="#5eb0ff">Canvas</tspan></text>
    <text x="764" y="322" font-size="37" font-weight="500" fill="#c6d2e8">Think in 3D. Speak a goal. Merge ideas into action plans.</text>
    <g font-size="26" font-weight="600">
      <rect x="764" y="368" width="228" height="58" rx="29" fill="none" stroke="#5eb0ff" stroke-width="2.5"/>
      <text x="878" y="407" text-anchor="middle" fill="#8fc2ff">Meta Quest</text>
      <rect x="1008" y="368" width="150" height="58" rx="29" fill="none" stroke="#8b7bff" stroke-width="2.5"/>
      <text x="1083" y="407" text-anchor="middle" fill="#b3a8ff">WebXR</text>
      <rect x="1174" y="368" width="220" height="58" rx="29" fill="none" stroke="#5ecf7f" stroke-width="2.5"/>
      <text x="1284" y="407" text-anchor="middle" fill="#8fe3ab">Hands-first</text>
    </g>
  </g>
</svg>
